# Release Klakboard, executee par le runner auto-heberge de l'orga LokLakh-s.
#
# A chaque push sur main touchant Windows/Klakboard, si "version" dans package.json
# n'a pas encore de release klakboard-v<version>, lance les tests puis construit
# dans un conteneur electron-builder (Wine inclus, l'hote n'a besoin que de Docker) :
#   - l'installeur NSIS (premiere installation, changement de version d'Electron)
#   - app-electron<majeure>.asar (mise a jour depuis l'appli, sur ce moteur seulement)
# puis publie la release, taguee sur le commit construit.
# Un push force (historique reecrit) ne declenche pas ce workflow : le lancer a la main.
name: Klakboard release

on:
  push:
    branches: [main]
    paths: ['Windows/Klakboard/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency: klakboard-release

jobs:
  release:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: Windows/Klakboard
    steps:
      - uses: actions/checkout@v6

      - name: Version a publier
        id: ver
        uses: actions/github-script@v8
        with:
          script: |
            const { version } = require(`${process.env.GITHUB_WORKSPACE}/Windows/Klakboard/package.json`);
            const tag = `klakboard-v${version}`;
            let exists = true;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (e) {
              if (e.status !== 404) throw e;
              exists = false;
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('exists', String(exists));
            core.notice(exists ? `${tag} existe deja : rien a publier (bumper "version").` : `Publication de ${tag}.`);

      # Conteneur lance avec l'uid du runner : sinon node_modules/ et dist/ appartiennent
      # a root et le checkout suivant ne peut plus nettoyer le workspace. HOME pointe
      # dans le cache de l'hote : Wine exige un HOME possede par l'utilisateur, et le
      # prefixe Wine y est conserve d'un build a l'autre.
      - name: Tests et build (electron-builder + Wine, en conteneur)
        if: steps.ver.outputs.exists == 'false'
        run: |
          CACHE="$HOME/.cache/klakboard-build"
          mkdir -p "$CACHE/home"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/cache/home -e npm_config_cache=/cache/npm \
            -e ELECTRON_CACHE=/cache/electron -e ELECTRON_BUILDER_CACHE=/cache/electron-builder \
            -v "$PWD":/project -w /project -v "$CACHE":/cache \
            electronuserland/builder:wine \
            bash -c "npm ci --no-audit --no-fund && npm test && npx electron-builder --win --publish never"

      - name: Publier la release
        if: steps.ver.outputs.exists == 'false'
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { VERSION, TAG } = process.env;
            const app = path.join(process.env.GITHUB_WORKSPACE, 'Windows/Klakboard');
            const dist = path.join(app, 'dist');
            // L'archive ne tourne que sur le moteur qui l'a construite : son nom
            // porte la version majeure d'Electron, et l'appli n'installe que la sienne.
            const electronMajor = require(path.join(app, 'node_modules/electron/package.json')).version.split('.')[0];
            const assets = [
              [`Klakboard Setup ${VERSION}.exe`, `Klakboard.Setup.${VERSION}.exe`],
              ['win-unpacked/resources/app.asar', `app-electron${electronMajor}.asar`],
            ];
            // Les versions <= 1.2.5 ne cherchent que "app.asar" (et tournent sur Electron 33).
            if (electronMajor === '33') assets.push(['win-unpacked/resources/app.asar', 'app.asar']);
            for (const [file] of assets) {
              if (!fs.existsSync(path.join(dist, file))) core.setFailed(`Artefact manquant : ${file}`);
            }
            if (process.exitCode) return;

            const { data: rel } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: TAG,
              target_commitish: context.sha,
              name: `Klakboard ${VERSION}`,
              body: `Klakboard ${VERSION} (Electron ${electronMajor}). Mise a jour depuis l'appli : clic droit sur l'icone de la zone de notifications.`,
            });
            for (const [file, name] of assets) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: rel.id,
                name,
                data: fs.readFileSync(path.join(dist, file)),
              });
            }
            core.notice(`${TAG} publiee : ${rel.html_url}`);
