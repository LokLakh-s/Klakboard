# Publishes a release when "version" in package.json has no klakboard-v<version>
# release yet: bump the version and push to main. Builds run on GitHub-hosted
# runners, natively (no Wine).
#
# Release files read by the in-app updater (names must not change):
#   Klakboard.Setup.<version>.exe   full installer (first install, Electron upgrade)
#   app-electron<major>.asar        app archive, only runs on that Electron major
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      electron: ${{ steps.v.outputs.electron }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          electron=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version.split('.')[0]")
          tag="klakboard-v$version"
          # Only a 404 means "not released yet"; any other error stops the run.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id 2>&1); then
            publish=false
            echo "::notice::$tag already exists: bump \"version\" in package.json to publish."
          elif grep -q 'HTTP 404' <<<"$out"; then
            publish=true
            echo "::notice::Publishing $tag (Electron $electron)."
          else
            echo "$out"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "electron=$electron"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON: ${{ needs.version.outputs.electron }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder --win --publish never
      - name: Collect release files
        shell: bash
        run: |
          mkdir out
          cp "dist/Klakboard Setup $VERSION.exe" "out/Klakboard.Setup.$VERSION.exe"
          cp dist/win-unpacked/resources/app.asar "out/app-electron$ELECTRON.asar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # tag + release
      id-token: write       # build provenance
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      ELECTRON: ${{ needs.version.outputs.electron }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # previous tag and commit log for the notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'klakboard-v*' 2>/dev/null || true)
          {
            echo "Klakboard $VERSION (Electron $ELECTRON)."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' ${prev:+"$prev..HEAD"}
            echo
            echo "## Install"
            echo
            echo "- **Windows**: run \`Klakboard.Setup.$VERSION.exe\`. The installer is not code-signed:"
            echo "  SmartScreen asks for confirmation (*More info* → *Run anyway*)."
            echo "- **Already installed**: Klakboard offers the update itself (tray icon → right click)."
            echo
            echo "Files are listed in \`SHA256SUMS\` and carry a build provenance attestation:"
            echo "\`gh attestation verify <file> -R $GITHUB_REPOSITORY\`."
          } > notes.md
          cat notes.md
      - name: Create tag and release
        run: gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Klakboard $VERSION" --notes-file notes.md
